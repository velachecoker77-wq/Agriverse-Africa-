<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Wallet 80%</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#0f172a;color:#fff;padding:16px;max-width:600px;margin:auto}.card{background:#1e293b;padding:14px;border-radius:12px;margin:10px 0}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#334155;color:#fff}button{width:100%;padding:14px;background:#f97316;color:#fff;font-weight:800;border:none;border-radius:10px}</style></head><body>
<h2>💰 Wallet - Test with Velache</h2>
<div id="info" class="card"></div>
<select id="batchSelect" style="background:#1e293b;color:#fff"></select>
<input id="saleAmount" type="number" placeholder="Sale Le e.g. 1000" oninput="calc()">
<div id="calc" class="card">Type amount</div>
<input id="phone" placeholder="Orange Money e.g. 079175093" value="079175093">
<button onclick="payout()">Pay 80% REAL Save</button>
<div id="out" class="card" style="display:none"></div>
<div id="list"></div>
<script>
const supa = supabase.createClient("https://hyporvepyvqzwmvaeubf.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cG9ydmVweXZxendtdmFldWJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MzE1NTgsImV4cCI6MjEwNzMwNzU1OH0.wqDJk3C8Jf1FeLuAMTfFf4jolDtSedZPxdxyyw-MQJY");
let fid = localStorage.getItem('farmer_id')||"AG-POULTRY-346";
document.getElementById('info').innerHTML="Farmer: "+fid;
async function loadB(){const{data}=await supa.from('batches').select('*').order('created_at',{ascending:false}).limit(20);const s=document.getElementById('batchSelect');s.innerHTML="";if(!data||!data.length){s.innerHTML="<option>No batches</option>";return;}data.forEach(b=>s.innerHTML+=`<option value="${b.batch_id}">${b.batch_id} - ${b.product} ${b.qty}</option>`);}
function calc(){const a=parseFloat(document.getElementById('saleAmount').value)||0;const f=Math.floor(a*0.8),ag=Math.floor(a*0.15),n=a-f-ag;document.getElementById('calc').innerHTML=`Sale ${a} Le<br>Farmer 80% = ${f} Le → Orange<br>Agriverse 15% = ${ag}<br>Node 5% = ${n}`;return{a,f,ag,n}}
async function payout(){const{a,f,ag,n}=calc();const batch=document.getElementById('batchSelect').value;const ph=document.getElementById('phone').value;if(!a||!ph){alert('Amount & phone');return;}const{error}=await supa.from('wallet_tx').insert([{batch_id:batch,sale_amount:a,farmer_80:f,agriverse_15:ag,node_5:n,phone:ph,status:'paid_simulated'}]);const o=document.getElementById('out');o.style.display='block';if(error){o.innerHTML="❌ "+error.message;}else{o.innerHTML=`✅ PAID! ${f} Le to ${ph} for ${batch} SAVED REAL!`;loadTx();}}
async function loadTx(){const{data}=await supa.from('wallet_tx').select('*').order('created_at',{ascending:false}).limit(10);document.getElementById('list').innerHTML=(data||[]).map(t=>`<div class='card'>${t.batch_id} → ${t.sale_amount} Le<br>Farmer ${t.farmer_80} Le to ${t.phone}<br>${new Date(t.created_at).toLocaleString()}</div>`).join('');}
loadB();loadTx();
</script></body></html>
