<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agriverse - Farmer Auth</title>
<style>
body{font-family:Arial;background:#0a1f0a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#122912;padding:30px;border-radius:16px;width:90%;max-width:400px;border:1px solid #2a5a2a}
h1{color:#7CFC00;text-align:center}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
button{width:100%;padding:14px;background:#7CFC00;color:#000;font-weight:bold;border:none;border-radius:10px;margin-top:15px;cursor:pointer;font-size:16px}
button:active{transform:scale(0.98)}
.note{font-size:12px;text-align:center;margin-top:10px;opacity:0.7}
</style>
</head>
<body>
<div class="card">
<h1>🌾 Agriverse Africa</h1>
<h3 style="text-align:center">Register Farmer</h3>
<input id="fullName" placeholder="Full Name - e.g. Aminata Sesay">
<input id="phone" placeholder="Phone - e.g. 076123456">
<input id="village" placeholder="Village - e.g. Shenbro">
<button onclick="registerFarmer()">REGISTER & GET AG KEY</button>
<p class="note" id="status">Bole Notebook - Real Database Live</p>
<hr style="margin:20px 0;opacity:0.2">
<h3 style="text-align:center">Already get AG Key?</h3>
<input id="agKeyLogin" placeholder="Enter AG Key - e.g. AG-123">
<button onclick="loginFarmer()" style="background:white">LOGIN</button>
</div>

<script>
async function registerFarmer(){
  const fullName = document.getElementById('fullName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const village = document.getElementById('village').value.trim();
  const status = document.getElementById('status');
  
  if(!fullName || !phone || !village){
    alert("Fill all fields!");
    return;
  }

  status.innerText = "Saving to Bole Notebook...";
  const ag_key = "AG-" + Date.now();

  try {
    const res = await fetch('/api/farmers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ag_key, full_name: fullName, phone, village })
    });
    const data = await res.json();
    
    if(data.success){
      localStorage.setItem('ag_key', ag_key);
      localStorage.setItem('farmer_name', fullName);
      status.innerText = "✅ Saved! AG Key: " + ag_key;
      alert("SUCCESS!\n\nName: " + fullName + "\nAG Key: " + ag_key + "\n\nE don save for real database!");
      window.location.href = "/dashboard.html";
    } else {
      status.innerText = "❌ Error: " + (data.error || "Failed");
      alert("Error: " + JSON.stringify(data));
    }
  } catch(err){
    status.innerText = "❌ Network Error";
    alert("Fetch error - check if /api/farmers live: " + err.message);
  }
}

function loginFarmer(){
  const key = document.getElementById('agKeyLogin').value.trim();
  if(!key){ alert("Enter AG Key"); return; }
  localStorage.setItem('ag_key', key);
  alert("Logged in as " + key);
  window.location.href = "/dashboard.html";
}
</script>
</body>
</html>
